<!DOCTYPE html>
<html>

<head>
    <title>CoCo 3 Remote WindInt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <style>
        body {
            background: #222;
            color: #0f0;
            font-family: 'VT323', monospace;
            box-sizing: border-box;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        .frame {
            border: 2px solid #0f0;
            padding: 20px;
            background: #000;
            /* Keep terminal area black */
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        h1 {
            font-family: 'Michroma', sans-serif;
            text-transform: uppercase;
            text-align: center;
            margin: 0 0 10px 0;
            font-size: 1.5em;
            letter-spacing: 2px;
            border-bottom: 1px dashed #0f0;
            padding-bottom: 10px;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 15px;
            font-family: 'Michroma', sans-serif;
            font-size: 0.8em;
        }

        a {
            color: #0f0;
            text-decoration: none;
            margin: 0 15px;
            border: 1px solid #0f0;
            padding: 5px 10px;
            transition: all 0.2s;
        }

        a:hover {
            background: #0f0;
            color: #000;
        }

        #container {
            position: relative;
            display: inline-block;
            /* Allow container to shrink-wrap content */
            background: black;
            border: 1px solid #444;
            margin: 20px auto;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #terminal {
            position: relative;
        }

        #terminal {
            z-index: 10;
        }

        .xterm-viewport,
        .xterm-screen {
            background: transparent !important;
        }

        .xterm-viewport {
            overflow: hidden !important;
            /* Hide scrollbar to prevent width issues */
        }

        #helpOverlay {
            display: none;
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            background: rgba(0, 0, 0, 0.9);
            color: #00FF00;
            border: 2px solid #333;
            padding: 20px;
            z-index: 100;
            font-family: monospace;
        }

        .key-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            border-bottom: 1px dotted #333;
        }
    </style>
</head>

<body>
    <div id="helpOverlay">
        <h2>🌶️ Pico-de-GIME Reference</h2>
        <div class="key-row"><span>PC Up Arrow</span><span>OS-9 Cursor Up (0x0C)</span></div>
        <div class="key-row"><span>PC Down Arrow</span><span>OS-9 Cursor Down (0x0A)</span></div>
        <div class="key-row"><span>PC Escape</span><span>OS-9 BREAK (0x03)</span></div>
        <div class="key-row"><span>PC Home</span><span>OS-9 Home (0x01)</span></div>
        <div class="key-row"><span>PC Delete</span><span>OS-9 Erase Line (0x18)</span></div>
        <div class="key-row"><span>PC F1</span><span>Toggle This Help</span></div>
        <p style="text-align:center; color:#aaa;">Press F1 to close</p>
    </div>

    <div class="frame">
        <h1>Pico-de-GIME</h1>
        <div class="nav-links">
            <a href="/setup">SETUP</a>
            <a href="/debug">DIAGNOSTICS</a>
        </div>

        <div id="container">
            <!-- Canvas size will be set by JS to match terminal -->
            <canvas id="gfxLayer"></canvas>
            <div id="terminal"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gfxLayer');
        const ctx = canvas.getContext('2d');
        let pen = { x: 0, y: 0, color: '#FFFFFF' };
        let term; // Global for access if needed

        // Wait for fonts to be ready/loaded before initializing terminal to get correct metrics
        document.fonts.ready.then(() => {
            // Initialize terminal with specific font settings for consistent sizing
            term = new Terminal({
                cols: 80,
                rows: 24,
                fontFamily: "'VT323', monospace",
                fontSize: 22, // VT323 is condensed, so 20-22px looks best
                letterSpacing: 0,
                lineHeight: 1.0,
                theme: { background: 'transparent' },
                lineHeight: 1.0,
                theme: { background: 'transparent' },
                scrollback: 0, // Assume fixed screen
                convertEol: true // Treat \n as \r\n
            });

            const termContainer = document.getElementById('terminal');
            term.open(termContainer);

            // Force resize to ensure internal state is correct
            term.resize(80, 24);

            // SYNC: Set canvas and container size to match the rendered terminal exactly
            // We defer slightly to ensure the DOM has calculated layout
            setTimeout(() => {
                const width = termContainer.offsetWidth;
                const height = termContainer.offsetHeight;

                canvas.width = width;
                canvas.height = height;

                console.log(`GIME Terminal Initialized: ${width}x${height}`);
            }, 100);
        });

        const socket = new WebSocket('ws://' + location.host + '/ws');

        const splashArt = `
\x1b[32m  _____  _                   _        \x1b[31m_____ _____ __  __ ______ 
\x1b[32m |  __ \\(_)                 | |      \x1b[31m/ ____|_   _|  \\/  |  ____|
\x1b[32m | |__) |_  ___ ___       __| | ___ \x1b[31m| |  __  | | | \\  / | |__   
\x1b[32m |  ___/| |/ __/ _ \\     / _\` |/ _ \\\x1b[31m| | |_ | | | | |\\/| |  __|  
\x1b[32m | |    | | (_| (_) |   | (_| |  __/\x1b[31m| |__| |_| |_| |  | | |____ 
\x1b[32m |_|    |_|\\___\\___/     \\__,_|\\___| \x1b[31m\\_____|_____|_|  |_|______|
\x1b[0m
\x1b[1m          -- Wireless WindInt Terminal Bridge for CoCo 3 --\x1b[0m
\x1b[3m             "Spicing up the 6809 experience since 2026"\x1b[0m
\x1b[90m--------------------------------------------------------------------------------\x1b[0m
`;

        // To display it, call this when the socket opens:
        socket.onopen = () => {
            term.write(splashArt);
            term.write("Connecting to Pico W at " + location.host + "...\\r\\n");
        };

        socket.onmessage = (ev) => {
            const data = JSON.parse(ev.data);
            if (data.status === "BOOT_READY") {
                term.write("\x1b[32m[OK]\x1b[0m GIME Stream Synchronized.\r\n");
            }
            if (data.t === "txt") {
                if (data.clr_gfx) ctx.clearRect(0, 0, canvas.width, canvas.height);
                term.write(data.d);
            } else if (data.t === "gfx") {
                handleGraphics(data);
            }
        };

        // OS-9 Key Mapping
        const KEY_MAP = {
            '\x1b[A': '\x0c', // Up -> 0x0C
            '\x1b[B': '\x0a', // Down -> 0x0A
            '\x1b[C': '\x09', // Right -> 0x09
            '\x1b[D': '\x08', // Left -> 0x08
            '\x1b[H': '\x01', // Home -> 0x01
            '\x1b': '\x03', // ESC -> BREAK (0x03)
            '\x1b[3~': '\x18' // Delete -> Erase Line (0x18)
        };

        // Capture keystrokes and send to Pico
        term.onData(data => {
            if (socket.readyState === WebSocket.OPEN) {
                const payload = KEY_MAP[data] || data;
                socket.send(payload);
            }
        });

        function handleGraphics(msg) {
            ctx.strokeStyle = pen.color;
            ctx.fillStyle = pen.color;
            const p = msg.p;

            switch (msg.cmd) {
                case "move": pen.x = p[0]; pen.y = p[1]; break;
                case "line":
                    ctx.beginPath(); ctx.moveTo(pen.x, pen.y);
                    ctx.lineTo(p[0], p[1]); ctx.stroke();
                    pen.x = p[0]; pen.y = p[1];
                    break;
                case "circle":
                    ctx.beginPath(); ctx.arc(pen.x, pen.y, p[0], 0, 2 * Math.PI);
                    ctx.stroke(); break;
            }
        }

        // Help Overlay Toggle (F1)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F1') {
                e.preventDefault();
                const el = document.getElementById('helpOverlay');
                el.style.display = el.style.display === 'block' ? 'none' : 'block';
            }
        });
    </script>
</body>

</html>
